# Ontora's shared installation. Deploy this Blueprint from the fork.
services:
  - type: web
    name: ontora-proxy
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    region: oregon
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ontora-proxy-db
          property: connectionString
      # Confirm the assigned hostname before the first sign-in.
      - key: APP_URL
        value: https://ontora-proxy-q200.onrender.com
      - key: AUTH_SECRET
        generateValue: true
      # This is a fresh database. Preserve this key through subsequent deployments.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ALLOWED_SIGNUP_EMAILS
        value: ontora.com
      - key: TELEMETRY_ENABLED
        value: 'false'

databases:
  - name: ontora-proxy-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: oregon
    postgresMajorVersion: '17'
    databaseName: proxy
    user: proxy
    ipAllowList: []
